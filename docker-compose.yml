services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mnemic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a random hex PostgreSQL password}
      POSTGRES_DB: mnemic
    restart: unless-stopped
    volumes:
      - mnemic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemic -d mnemic"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: mnemic-server:${MNEMIC_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://mnemic:${POSTGRES_PASSWORD:?set PostgreSQL password}@postgres:5432/mnemic
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: [/tmp]

  server:
    image: mnemic-server:${MNEMIC_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://mnemic:${POSTGRES_PASSWORD:?set PostgreSQL password}@postgres:5432/mnemic
      MNEMIC_AUTH_TOKEN: ${MNEMIC_AUTH_TOKEN:?set a random Bearer token}
      MNEMIC_MASTER_KEY: ${MNEMIC_MASTER_KEY:?set the 64-hex encryption master key}
      MNEMIC_EMBEDDING_DIMENSIONS: "1024"
      HOST: 0.0.0.0
      PORT: "3000"
      CORS_ORIGIN: https://${MNEMIC_DOMAIN:?set the public hostname}
      MNEMIC_USAGE_PRICES_JSON: ${MNEMIC_USAGE_PRICES_JSON:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    image: mnemic-web:${MNEMIC_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /data:uid=1000,gid=1000,mode=0700
      - /config:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2-alpine
    environment:
      MNEMIC_DOMAIN: ${MNEMIC_DOMAIN:?set the public hostname}
    ports:
      - "${MNEMIC_BIND_IP:-0.0.0.0}:${MNEMIC_HTTP_PORT:-80}:80"
      - "${MNEMIC_BIND_IP:-0.0.0.0}:${MNEMIC_HTTPS_PORT:-443}:443"
      - "${MNEMIC_BIND_IP:-0.0.0.0}:${MNEMIC_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - mnemic-caddy-data:/data
      - mnemic-caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

volumes:
  mnemic-pgdata:
  mnemic-caddy-data:
  mnemic-caddy-config:
