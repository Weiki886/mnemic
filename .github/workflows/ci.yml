name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r run lint && pnpm exec eslint scripts/*.mjs

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test && node --test scripts/*.test.mjs

      - name: Build
        run: pnpm -r run build

  deployment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify isolated HTTPS deployment
        run: node scripts/verify-deployment.mjs
